name: Liverpool Playwright
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npm run test:unit
      # El E2E en vivo es informativo: los runners de GitHub usan IPs de datacenter que
      # el anti-bot (Akamai) de Liverpool bloquea con 403, por lo que no puede exigirse.
      - run: npm test
        continue-on-error: true
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
